# Builds Wharf and runs its unit tests on every change.
#
# The secret scan, dependency checks and workflow audit live in gauntlet.yml,
# so they are not repeated here.
#
# Actions are pinned to full commit hashes, as the gauntlet requires. The unit
# tests run inside Wharf.app as a host; the app skips its own startup under test
# (Debug builds only), so the runner's Dock and preferences are never touched.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Docky.xcodeproj \
            -scheme Docky \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/WharfTests.xcresult" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Keep the test results when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WharfTests.xcresult
          path: ${{ runner.temp }}/WharfTests.xcresult
          retention-days: 7

  release-build:
    name: Release build compiles
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Docky.xcodeproj \
            -scheme Docky \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
